name: zoo.com.tr sync

# Daily price/stock sync with zoo.com.tr plus import of newly stocked items. See scripts/zoo/sync.mjs.
on:
  schedule:
    - cron: "0 0 * * *" # 03:00 Europe/Istanbul
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the changes without writing"
        type: boolean
        default: false

concurrency:
  group: zoo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Crawled pages, groupings and translations: restored so unchanged items never cost a Claude call.
      - uses: actions/cache@v4
        with:
          path: .data/zoo
          key: zoo-data-${{ github.run_id }}
          restore-keys: zoo-data-
      - name: Sync
        run: node scripts/zoo/sync.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          CATALOG_REVALIDATE_SECRET: ${{ secrets.CATALOG_REVALIDATE_SECRET }}
